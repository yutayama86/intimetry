name: Cloudflare Pages token preview smoke
on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Cloudflare account ID (not an API token)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Validate token and create isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          npx wrangler pages deploy dist --project-name=intimetry --branch=security-token-smoke-20261022
